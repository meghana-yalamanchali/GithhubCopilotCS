name: Validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python -m compileall main.py tests
      - run: python -m pytest tests/test_home.py
      - run: npx playwright test tests/browser/task-form.spec.js